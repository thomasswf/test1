name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".site-assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build photo assets
        shell: bash
        run: |
          mkdir -p assets
          cat .site-assets/furano.part*.b64 | tr -d '\n' | base64 --decode > assets/furano-snowboard-2024-12-21.webp
          cat .site-assets/iwahara.part*.b64 | tr -d '\n' | base64 --decode > assets/iwahara-2023-01-28.webp
          cat .site-assets/tsu3.part*.b64 | tr -d '\n' | base64 --decode > assets/tsumekizaki-lighthouse-2022-02-21.webp
          echo "7406afdd017d362e8c917fe4b98f4e365c7e30ba8912ed1d0f93e87969b99ad6  assets/furano-snowboard-2024-12-21.webp" | sha256sum -c -
          echo "0957d1828281a27d2ac981b71ef186b1edca3344986abca2e6dbb4b1e4eb9673  assets/iwahara-2023-01-28.webp" | sha256sum -c -
          echo "f0e1afae3e74f9972dc94959e1ce1e64f2d7d77770a20dd08c131732c550a791  assets/tsumekizaki-lighthouse-2022-02-21.webp" | sha256sum -c -
          rm -rf .site-assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
